<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Timezone Converter</title>

        <!-- Runs immediately (no defer) so the theme is set before first paint -->
        <script>
            (function () {
                try {
                    const pref = localStorage.getItem("tz-converter:theme");
                    const dark =
                        pref === "dark" ||
                        (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
                    document.documentElement.classList.toggle("dark", dark);
                } catch { }
            })();
        </script>

        <link rel="stylesheet" href="./dist/output.css" />
        <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js" defer></script>
        <script src="./src/main.js" defer></script>
    </head>

    <body class="min-h-screen bg-page text-ink flex items-center justify-center p-4">
        <main class="w-full max-w-md space-y-4 rounded-2xl border border-line bg-card p-6 shadow-xl shadow-accent/10">
            <header class="flex items-center justify-between gap-3">
                <h1 class="text-2xl font-semibold tracking-tight">Timezone Converter</h1>
                <select id="theme" aria-label="Theme"
                    class="rounded-lg border border-line bg-card px-2 py-1 text-sm text-muted focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent/40">
                    <option value="system">System</option>
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select>
            </header>

            <div class="grid grid-cols-2 gap-3">
                <label class="block">
                    <span class="text-sm text-muted">Date</span>
                    <input id="date" type="date" class="field" />
                </label>
                <div class="block">
                    <span class="text-sm text-muted">Time (24h)</span>
                    <div class="mt-1 flex items-center gap-1">
                        <select id="hour" aria-label="Hour" class="field !mt-0"></select>
                        <span class="font-semibold">:</span>
                        <select id="minute" aria-label="Minute" class="field !mt-0"></select>
                    </div>
                </div>
            </div>

            <label class="block">
                <span class="text-sm text-muted">From timezone</span>
                <select id="from-zone" class="field"></select>
            </label>

            <label class="block">
                <span class="text-sm text-muted">To timezone</span>
                <select id="to-zone" class="field"></select>
            </label>

            <div class="rounded-xl border border-line bg-page p-4 text-center">
                <p id="result-time" class="text-4xl font-bold tracking-tight text-accent"></p>
                <p id="result-detail" class="mt-1 text-sm text-muted"></p>
            </div>

            <button id="save-btn" type="button"
                class="w-full cursor-pointer rounded-lg bg-accent p-2 font-medium text-accent-ink transition-colors hover:bg-accent-hover focus:outline-none focus:ring-2 focus:ring-accent/40">
                Save conversion
            </button>

            <section class="pt-2">
                <h2 class="mb-2 text-lg font-semibold">Saved conversions</h2>
                <p id="empty-msg" class="text-sm text-muted">Nothing saved yet.</p>
                <ul id="saved-list" class="space-y-2"></ul>
            </section>
        </main>
    </body>

</html>
